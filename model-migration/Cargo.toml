[package]
name = "mary-model-migration"
version = "0.1.0"
edition = "2021"
description = "One-way, strictly additive migration of Mary's legacy branch-model piles into native model collections."
license = "MIT OR Apache-2.0"

# Deliberately its OWN workspace root, not a member of anything in ../. The
# bridge has migration-only feature and dependency needs, while Mary's runtime
# remains collection-only. TribleSpace main retains the read-only pin snapshot
# and historical branch/commit encodings needed here; no mutable legacy API or
# old TribleSpace checkout is part of the migration.
[workspace]

[dependencies]
# mary supplies the model-graph schema this migration projects INTO: the
# canonical attributes (format::attrs), the legacy-alias projection and the
# native publish/snapshot seam (model_collection), and the exact selectors
# (selection). The dependency points one way only — mary knows nothing of this
# crate. PersonaPlex currently shares Mary's lean `qwen3tts` module gate; using
# that gate avoids pulling the runtime-only Accelerate oracle dependencies.
mary = { package = "maryml", version = "0.1.0", path = "..", features = ["qwen3tts"] }
triblespace = { version = "0.47.0", path = "../../triblespace-rs", default-features = false }
anybytes = { version = "0.20.3", path = "../../anybytes" }
anyhow = "1"
# A migration signs the native commit it publishes, so the key type is not
# optional here the way it is for a pure reader.
ed25519-dalek = { version = "2", features = ["rand_core"] }
# This crate IS the control-plane command, so clap is unconditional rather than
# behind the `model-migration-cli` feature mary used to carry.
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "mary-model-migrate"
path = "src/main.rs"

# SOURCE-BUILD-ONLY: retain the tested network readiness repair.
# Registry consumers intentionally use upstream netwatch without these fixes.
# Root patches are not inherited; this source/registry difference is deliberate.
[patch.crates-io]
netwatch = { git = "https://github.com/erlkonig-ai/net-tools.git", rev = "10ab7b328809103be74f6ca24258249715fae52b" }
