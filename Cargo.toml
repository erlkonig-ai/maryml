name = "nomic_mm7b_vision_parity"
required-features = ["gemma"]

# GGUF / pytorch-.bin import validation (import path); the value-check bodies are
# `#[ignore]` (need a cached HF model), the compile is the always-on part.
[[test]]
name = "formats_import"
required-features = ["import"]

# The STT lane, live: file-paced streaming transcription + (morning) mic mode.
[[bin]]
name = "voxtral_listen"
required-features = ["voxtral"]

# Kimi K3: the `situ` activation against oracle vectors captured from the
# shipped `SituAndMul`. CPU lane only under `k3`; add `k3-cuda` for
# the GPU lane as well.
[[bin]]
name = "kimi_situ_gate"
required-features = ["k3"]

# MXFP4 decode + MXFP4 -> NVFP4 transcode gate: bit-exactness against the
# k3oracle reference decode of real Kimi-K3 expert bytes.
# The latent MoE block against the whole-layer oracle: the router, the latent
# bottleneck, one expert in isolation, the 16-of-896 combination over the real
# expert set, and the shared experts. Reads the checkpoint directly (safetensors
# headers are parsed in the gate, so no `import` feature) and decodes the routed
# experts with mary::nn::mxfp4, hence `mxfp4`; `k3` supplies the config.
[[bin]]
name = "k3_moe_gate"
required-features = ["k3"]

# The whole-layer gate: one Kimi-K3 decoder layer composed out of the ported
# primitives, held to the whole-layer oracle at every sub-block boundary. Reads
# the checkpoint shards directly (safetensors + mmap) and the oracle .npz, so it
# needs the k3 feature in full.
[[bin]]
name = "k3_layer_gate"
required-features = ["k3-cuda"]

[[bin]]
name = "mxfp4_gate"
required-features = ["mxfp4"]

# How far the bit-exact transcode reaches: sweep the E8M0 exponent span of a
# checkpoint's scale planes (reads scales only, never a weight byte).
[[bin]]
name = "mxfp4_span_sweep"
required-features = ["mxfp4"]

# Which block-scaled FP4 tensor-core shapes THIS GPU reports (MXFP4 ue8m0
# scale_vec::2X vs NVFP4 e4m3 scale_vec::4X) — the transcode's target, asked
# rather than assumed.
[[bin]]
name = "mxfp4_mma_probe"
required-features = ["mxfp4", "cuda-backend"]

[[bin]]
name = "mxmma_probe"
required-features = ["mxfp4", "cuda-backend"]

[[bin]]
name = "k3_expert_index"
required-features = ["k3"]
[[bin]]
name = "personaplex_xdev_probe"
required-features = ["qwen3tts", "q4"]

[[bin]]
name = "depth_xdev_probe"
required-features = ["qwen3tts", "q4"]

[[bin]]
name = "personaplex_listen"
required-features = ["personaplex", "q4"]

[[bin]]
name = "spm_graph_roundtrip"
required-features = ["personaplex"]

# Reads `models::k3` but had no entry, so `--all-targets` under any feature set
# without `k3` failed to compile its test harness -- which is the one build the
# lib tests ride in on. Every other k3 binary declares this; this one was
# missed.
[[bin]]
name = "resident_final"
required-features = ["k3-cuda"]

# Twelve Blackwell/CUDA binaries that had no entry at all. Each reaches
# `models::inkling` or `cubecl`, so under any feature set without
# `inkling-cuda` they failed to compile -- and because `cargo test` builds
# every bin target before it runs an integration test, that made
# `cargo test --features import` (and every other feature set) unrunnable
# rather than merely noisy. The gates themselves are unchanged; only their
# admission is now declared.
[[bin]]
name = "nvfp4_mma_probe"
required-features = ["inkling-cuda"]

# The hand-written PTX arm of the routed NVFP4 GEMM against the cubecl one, in
# one process on the same handles: elementwise bit-identity first, then p50 per
# arm over interleaved rotating-table rounds.
[[bin]]
name = "ptx_fp4_probe"
required-features = ["inkling-cuda"]

[[bin]]
name = "bf16_mma_probe"
required-features = ["inkling-cuda"]

[[bin]]
name = "fp4quant_gate"
required-features = ["inkling-cuda"]

# What narrow-float conversions does the device itself report and execute?
[[bin]]
name = "minifloat_caps_probe"
required-features = ["inkling-cuda", "cuda-backend"]

[[bin]]
name = "inkling_zerocopy_gate"
required-features = ["inkling-cuda"]

[[bin]]
name = "inkling_fp4_expert_gate"
required-features = ["inkling-cuda"]

[[bin]]
name = "inkling_bf16_expert_gate"
required-features = ["inkling-cuda"]

[[bin]]
name = "inkling_align_gate"
required-features = ["inkling-cuda"]

[[bin]]
name = "inkling_quant_levels"
required-features = ["inkling-cuda"]

[[bin]]
name = "inkling_pile_import"
required-features = ["inkling-cuda"]

[[bin]]
name = "inkling_expert_import"
required-features = ["inkling-cuda"]

[[bin]]
name = "inkling_dense_import"
required-features = ["inkling-cuda"]

[[bin]]
name = "inkling_pile_names"
required-features = ["inkling-cuda"]

[[bin]]
name = "backend_matmul_probe"
required-features = ["burn-cuda-bench"]

# Why the same hand w4a16 kernel reads ~98 GB/s at the head shape and ~64 at the
# sink shapes: n / k / m_pad sweeps, null-launch cost, and a split-vs-fused run
# of the real sink GEMMs. One process, one worktree.
[[bin]]
name = "w4a16_shape_sweep"
required-features = ["inkling-cuda"]

# Does the pre-permuted weight layout help a SMALL launch as much as a big one?
# Sweeps the grid on both fp4 lanes; the column that matters is the ratio.
[[bin]]
name = "swz_grid_scaling"
required-features = ["inkling-cuda"]

# Does a CUDA graph capture survive cubecl's dispatch path, and what does a
# replay cost per node? Feasibility gate for the decode-loop capture.
[[bin]]
name = "graph_capture_probe"
required-features = ["inkling-cuda"]

[[bin]]
name = "graph_patch_probe"
required-features = ["inkling-cuda"]

# What a token's worth of collectives costs THROUGH cubecl's stream-ordered
# all_reduce, rather than through the hand-written .cu that measured the wire.
# The two differ in the two ways that matter to the split: the forward does not
# sync between collectives, and cubecl adds host work the .cu never does.
[[bin]]
name = "tp_allreduce_probe"
required-features = ["inkling-cuda"]

# Does a cubecl all_reduce fork/join CAPTURE into a CUDA graph and REPLAY? One
# GPU, a world of one, three device ops, the answer read off one buffer. The
# cheap half of the question that decides whether INK_GRAPH_LANE may run under
# INK_TP; the module doc says what the two-rank half is.
[[bin]]
name = "collective_graph_probe"
required-features = ["inkling-cuda"]

[[bin]]
name = "gemm_grid_parity"
required-features = ["inkling-cuda"]

# Gate for the ANN head against a dense reference, including the W4A16 live-row
# mask. Owns CUDA directly.
[[bin]]
name = "inkling_ann_gate"
required-features = ["inkling-cuda"]

# S1 of the training path (compass 84605490): one decoder layer differentiable
# under Autodiff<Cuda<f32>>, gated on forward parity and finite-difference
# gradients against the host f32 reference.
[[bin]]
name = "inkling_train_probe"
required-features = ["inkling-cuda"]

[[bin]]
name = "inkling_train_step"
required-features = ["inkling-cuda", "tokenizer"]

[[bin]]
name = "inkling_train_online"
required-features = ["inkling-cuda", "tokenizer"]

# Synthetic cached-attention reader/tile comparison; no model or pile access.
[[bin]]
name = "inkling_cached_attention_bench"
required-features = ["inkling-cuda"]

# Debug info was 94.7% of a debug binary here: the `trible` test binary
# measured 1.97 GB, of which only 110 MB was code. Cargo never collects old
# hash-suffixed generations either, so that multiplied until one target/ tree
# reached 728 GB and filled the disk. `panicked at file.rs:12:3` comes from
# `#[track_caller]`, not DWARF, so it survives this; what goes is file:line
# inside RUST_BACKTRACE frames, and gdb locals.
[profile.dev]
debug = 0
