[package]
name = "mary"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Neural-network models as content-addressed graphs in TribleSpace. A tensor is a self-describing Array<F32> leaf; a module is an entity; composition is role-edges. Named for Mary — both Mary Wollstonecraft Shelley, who wrote the creature into being, and her mother Mary Wollstonecraft. The format in which dead weights become a living, recomposable model-graph; the franken-stitch is the spark."
license = "MIT OR Apache-2.0"

[dependencies]
# `madvise(MADV_DONTNEED)` + `posix_fadvise(POSIX_FADV_DONTNEED)` for the startup copy: on a unified-memory part the
# source page cache and the anonymous arena are the same pool, so the copy has
# to hand each leaf's source pages back as it goes. See
# `models::inkling::pile::SourceRelease`.
libc = "0.2"
burn = { version = "0.21.0", default-features = false, features = ["wgpu", "metal", "autodiff"] }
# Kernel fusion for the qwen3tts decode loop, WITHOUT flipping burn-wgpu's
# global "fusion" flag: that flag rewrites the `Metal` alias to the Fusion
# wrapper, which breaks gemma's zero-copy CubeTensor seam (persist.rs). These
# two deps only add the Fusion wrapper type + its impl for CubeBackend;
# qwen3tts declares its own fused alias (nn::backend::BFused) and everything
# else keeps the raw backend. (burn 0.21's top-level "fusion" feature is
# unresolvable on crates.io — it pulls a pre-release burn-cpu.)
burn-fusion = { version = "0.21.0", optional = true }
burn-cubecl = { version = "0.21.0", default-features = false, features = ["fusion"], optional = true }
triblespace = { version = "0.47.0", path = "../triblespace-rs", default-features = false }
anybytes = "0.20"
# safetensors is IMPORT-ONLY: runtime builds load weights exclusively from
# piles. Only the `import` feature (persist importers + parity gates) compiles
# a safetensors reader — inference/serve builds cannot reach one.
safetensors = { version = "0.4.5", optional = true }
# GGUF (.gguf) import — container parsing only (no async, no backend); the ggml
# block dequant to f32 lives in `formats::gguf`. Lean: hashbrown + serde +
# thiserror + libm, all already in-tree or trivial. Import-only.
gguf-rs-lib = { version = "0.2.5", default-features = false, features = ["std", "alloc", "libm"], optional = true }
# PyTorch pickle .bin/.pth import — `formats::pickle` walks the ZIP's `data.pkl`
# with a small self-contained pickle-opcode interpreter (no candle/torch
# runtime, no fragile third-party pickle crate — the torch `state_dict` opcode
# set is small and stable), then reads each storage member out of the ZIP. Only
# `zip` is needed; the pickle reader is hand-rolled in-tree. Pure-Rust deflate
# backend only (torch storages are STOREd uncompressed, data.pkl may be
# deflated) — no bzip2/zstd/aes C deps. Import-only.
zip = { version = "0.6", default-features = false, features = ["deflate"], optional = true }
# clap powers the opt-in control-plane CLI: the import front door. It stays out
# of lib-consumer/runtime builds. (The legacy-model migration tool used to share
# it; that tool now lives in the standalone `model-migration/` crate.)
clap = { version = "4", features = ["derive"], optional = true }
# hf-hub auto-downloads models from the HuggingFace hub for `mary import`
# (sync/ureq client, no async runtime needed). Import-only.
hf-hub = { version = "0.3", optional = true }
# Kimi-K3's tiktoken pre-tokenizer (mary::tiktoken). fancy-regex, not regex:
# the shipped `pat_str` ends in `\s+(?!\S)`, a negative lookahead the `regex`
# crate rejects outright — and fancy-regex is the engine `tiktoken` itself runs
# the pattern on, so the pre-tokenizer is identical by construction. Pure Rust,
# no C deps. Behind `k3tok`; the default build stays light.
fancy-regex = { version = "0.14", optional = true }
half = { version = "2", features = ["zerocopy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Pile loading (mary::persist) is THE runtime weight path, so its deps are
# unconditional: a Repository needs a signing key (ed25519 + OsRng via rand)
# and the loaders report errors via anyhow.
anyhow = "1"

# NO COGNITION LOOP HERE, as of 2026-08-31. mary is the models and the ML; the
# harness lives in drive. This is the direction JP fixed when the crate cycle
# surfaced ("mary should just be the models/ML, so all the harness code should
# move to drive"), and it is not a style preference — the one-binary collapse
# made mary link drive, drive already links faculties, and faculties links mary,
# so cargo refused to resolve the package graph at all. Building mary did NOT
# catch it: the cycle only bites when faculties is the root.
#
# What moved: `InklingMind` and its `drive::mind::Mind` impl (resident.rs from
# its doc comment at former line 1435 onward) and the `inkling_drive` binary.
# What stayed, because it is the MODEL talking about itself rather than the
# harness talking about turns: the `Model` trait, `Ready`, `InklingContext`,
# the codec, the native output parser — and `telemetry`, whose fragments are
# defined over those types (JP: "telemetry can stay in mary, that's just a
# shared dependency right?" — right; drive merely links the exported roots to
# the turn that caused them).
#
# The cut was measurable rather than aesthetic: the half that stayed had FIVE
# `drive::` occurrences and every one was a doc comment, while the half that
# left had 82 code references. The boundary was already in the code; it was
# only drawn in the wrong place in the crate layout. The arrows now run
# drive -> mary, drive -> faculties, faculties -> mary, and nothing cycles.
#
# `framed-stream` left with the wire it framed. Nothing in mary speaks a framed
# stream any more: the mind and the model are one process, and the two tensor
# ranks talk over the rendezvous socket the NCCL Group already holds.

# Flux.2 port (mary::models::flux) deps mary's other models don't need.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
tokenizers = { version = "0.21", optional = true }
rand = "0.8"
# exact (erf-based) gelu for the CPU codec-encoder port (qwen3tts)
libm = { version = "0.2", optional = true }

# Gemma 4 multimodal port (mary::models::gemma) deps — all optional, gated behind `gemma`.
burn-train = { version = "0.21.0", optional = true }
burn-ndarray = { version = "0.21.0", optional = true }
cubecl = { version = "0.10.0", default-features = false, features = ["std"], optional = true }
# The C++ backend's kernel-description types, for ONE thing: `models::inkling::rawcuda`
# hands the CUDA runtime a hand-written source string, and the runtime still
# wants the `ComputeKernel` repr a generated kernel carries (it reads the
# dynamic shared-memory size off it). The five type names that build an empty
# one live here. Same feature shape as cubecl-cuda's own dependency on it.
cubecl-cpp = { version = "0.10.0", default-features = false, features = ["cuda"], optional = true }
# The tuned matmul kernels burn itself dispatches to, reached DIRECTLY. The
# inkling lane holds raw cubecl handles rather than Burn tensors (the weights
# are the pile's own BF16 mapping), so it cannot call `Tensor::matmul`; but
# `cubek::matmul::launch::launch_ref` takes bindings, which is exactly what a
# handle is. Already in the graph via burn-cubecl -- naming it here adds no
# crate, only the ability to call it.
cubek = { version = "0.2", default-features = false, features = ["std", "stdlib", "matmul"], optional = true }
wgpu = { version = "29", optional = true }
pollster = { version = "0.4", optional = true }
memmap2 = { version = "0.9", optional = true }
sha2 = { version = "0.10", optional = true }
bytes = { version = "1", optional = true }
# Execution identity (`resident::ExecutionManifest`) and the cross-rank sequence
# digest both hash with it, and both are unconditional now.
blake3 = "1"
cudarc = { version = "0.19", default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "nccl",
    "fallback-dynamic-loading",
    "cuda-version-from-build-system",
    "fallback-latest",
], optional = true }
rustfft = { version = "6", optional = true }
rubato = { version = "0.16", optional = true }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "flac", "aac", "isomp4"], optional = true }
# Live mic capture for the listen loops (gemma_listen, voxtral_listen --mic):
# open a NAMED CoreAudio input device (Reachy Mini XVF3800 array or any Mac
# mic). Input side only; playback stays with the caller.
cpal = { version = "0.17", optional = true }
# On-disk pile persistence (mary::persist) needs a Repository signing key.
ed25519-dalek = { version = "2", features = ["rand_core"] }

[features]
# Resident Qwen3.5 Gated DeltaNet primitives. Raw CubeTensor throughout; these
# features do not select a Fusion backend or enable timing-based autotuning.
qwen3_5-gpu = ["dep:cubecl", "dep:burn-cubecl"]
qwen3_5-cuda = ["qwen3_5-gpu", "cubecl?/cuda", "burn/cuda"]
# THE RESIDENT MIND, whole: `models::inkling::engine` (a Session, the
# checkpoint's tokenizer, the incremental detokenizer and the host-side rank
# link) plus `models::inkling::resident` (the turn vocabulary and the
# `drive::mind::Mind`). One feature, because after the one-binary collapse the
# pieces only mean anything together — there is no build that wants the model
# without the loop or the loop without the model.
#
# `serve`, `inkling-serve` and `drive-mind` were the three-process arrangement's
# feature surface and went with it. `resident` itself is compiled
# UNCONDITIONALLY and without the CUDA lane (see the shim in `models/mod.rs`),
# which is what keeps the turn logic testable where a kernel cannot be compiled.
inkling-resident = ["inkling-cuda", "tokenizer"]
# The dMel front end alone -- an FFT and a filterbank, no backend. The ear
# faculty builds mary with this and nothing else of Inkling.
dmel = ["dep:rustfft", "dep:rubato"]
# CUDA/sm_121 lane for the PersonaPlex realtime stack. Selects cubecl-cuda for
# the q4 + temporal kernels; deliberately does NOT touch the `burn` dep, since
# the realtime lane never instantiates a burn backend (RealtimePipeline has no
# B: Backend generic, TemporalMetal is raw cubecl, DepthFast/Mimi are CPU).
cuda-backend = ["q4", "cubecl?/cuda"]
# Certified ordinary-f32 CUDA candidate scans for `nn::nvfp4_cosine`. This
# owns arithmetic only; collection assembly and exact source reranking remain
# downstream. A portable-f64 CUDA implementation remains test-only as a proof
# oracle.
nvfp4-cuda = ["dep:cubecl", "cubecl?/cuda"]
# Investigation-only: burn's REAL Cuda backend, for backend_matmul_probe.
burn-cuda-bench = ["burn/cuda", "burn/autotune"]

# Burn's timing-based autotune is deliberately not implicit in serving
# features. A sealed baseline has to select kernels from executable/config
# facts, not from startup timing noise. CUDA experiments that want Burn's
# timing search opt into the additive `inkling-cuda-autotune` feature below.
# Kimi-K3 (mary::models::k3) - the 2.78 T-param MoE vision-language model.
# Currently the loading skeleton only: config parsing plus the checkpoint
# name->module-slot layout. serde/serde_json are unconditional deps, so this
# feature adds nothing to the dependency graph; it only gates compilation.
# Kimi-K3 (mary::models::k3) - the 2.78 T-param hybrid-attention MoE: config,
# checkpoint name->module-slot layout, the ported operators (SiTU, KDA, MLA,
# AttnRes, the noaux_tc router, the latent MoE block) and the whole decoder
# layer that composes them, plus every gate that holds them to the shipped
# module. One feature, because the pieces only mean anything together: the
# layer gate streams its weights out of the 17 GB shards (safetensors + mmap),
# pins its oracle .npz bundles by hash (sha2), and runs a deterministic CPU
# reference lane that is not the GPU's (burn-ndarray) - float64 is the only
# width in which a wrong RMSNorm epsilon is visible at all.
k3 = ["import", "mxfp4", "burn/ndarray", "dep:safetensors", "dep:memmap2", "dep:sha2", "dep:burn-ndarray"]
# ...and the GB10/sm_121 lane on top, so the layer is also checked on the
# backend it will actually run on here. Needs the CUDA toolkit present.
k3-cuda = ["k3", "burn/cuda", "burn/autotune"]

# Inkling (Thinking Machines) - the 42-layer (276 B / 12 B active) MoE, on the
# only hardware it runs on. ONE feature, where there were three.
#
# `inkling` (headers, no backend) and `inkling-burn` (ndarray, so a gate could
# run without a GPU) described a model you could build without CUDA. Nothing
# does: every lane in the runtime is a Blackwell tensor-core lane, the NVFP4
# GEMM is an `mma.sync...kind::mxf4nvf4` intrinsic, and `fp4gemm` was already
# unconditional inside a module the `inkling` feature claimed needed no cubecl
# — so `--features inkling` alone had not compiled for some time and nobody
# noticed, which is what a feature nobody can select buys you.
#
# burn/ndarray went with `inkling-burn`: its only reader here was
# `inkling_burn_gate`, an ndarray-vs-CUDA BACKEND PARITY check, not an oracle.
inkling-cuda = [
    "import",
    "dep:safetensors",
    "dep:memmap2",
    "burn/cuda",
    "dep:cubecl",
    "cubecl?/cuda",
    "dep:cubecl-cpp",
    "dep:cubek",
    "dep:cudarc",
    # `burn-cubecl` is here for ONE type: `CubeTensor`, which is what a Burn
    # tensor on the CUDA backend already is underneath. Naming it is how
    # `models::inkling::seam` gets at the device buffer behind a Burn tensor
    # without a round trip through the host -- the routed-expert lane is raw
    # cubecl and everything around it is Burn, and those two have to be the
    # same bytes or the residual stream cannot stay on the device.
    "dep:burn-cubecl",
]
# Experimental only: permit Burn to benchmark candidate kernels at runtime.
# The baseline `inkling-cuda` feature keeps Burn on fixed kernel selection so
# two sealed ranks do not derive an execution choice from independent clocks.
inkling-cuda-autotune = ["inkling-cuda", "burn/autotune"]

# AttnRes (mary::models::k3::attn_res) - the depth-axis mixture and the
# snapshot boundary that resets it, in Burn. The module itself needs nothing
# new; this feature exists for `k3_attn_res_gate`, which wants burn-ndarray for
# a deterministic CPU arithmetic that is not the GPU's, and `import` for a
# safetensors reader (the gate takes the AttnRes weights from the checkpoint
# itself, not from the oracle).
k3-attn-res = ["k3", "import", "burn/ndarray", "dep:burn-ndarray"]
# ...and the GB10/sm_121 lane on top, so the primitive is also checked on the
# backend it will actually run on here. Needs the CUDA toolkit present.
k3-attn-res-cuda = ["k3-attn-res", "burn/cuda", "burn/autotune"]
# Safetensors → pile IMPORT support. The ONLY feature that compiles a
# safetensors reader (`WeightLoader::SingleFile`/`MultiShard`,
# `ingest::save_safetensors`, `persist::persist_safetensors_to_pile`, the
# `load_*_from_hf` constructors). Importer binaries and parity gates require
# it; every runtime/inference/serve path loads from piles and builds without it.
# Owns memmap2: every importer reads its shards through an mmap (a K3 shard
# is 17 GB and there are 96 of them), and `--features import` on its own did
# not link one before.
# Reading checkpoints that are already on disk. Deliberately does NOT include
# hf-hub: downloading from the Hub is a separate concern (`hub`), and bundling
# them meant a machine that only ever reads local files still had to link a
# system TLS stack. That bit — a second Spark could not build the importer for
# want of libssl-dev, to satisfy a downloader it would never call.
import = ["dep:safetensors", "dep:clap", "dep:gguf-rs-lib", "dep:zip", "dep:memmap2"]
# Fetching weights from the HuggingFace Hub. Pulls hf-hub, which hard-wires
# native-tls (hf-hub 0.3 offers no rustls backend), hence the system OpenSSL
# dependency. Anything that only reads local checkpoints should not enable it.
hub = ["dep:hf-hub"]
flux = ["dep:image", "dep:tokenizers"]
# SmolVLA (mary::models::smolvla) — vision-language-action; SigLIP vision +
# tokenizer + flow-matching sampler. Same dep surface as flux.
smolvla = ["dep:image", "dep:tokenizers"]
# Qwen3-TTS-12Hz-1.7B-Base (mary::models::qwen3tts) — streaming-voice
# candidate A: talker + code predictor + ECAPA speaker encoder + 12Hz codec
# decoder. Needs the Qwen2 BPE (tokenizers) + sampling (rand).
#
# `dep:cubecl` is here for ONE name: `nn::backend::speak` spells the Linux
# voice lane `CubeBackend<cubecl::cuda::CudaRuntime, ..>`, and that path needs
# the facade crate to be NAMEABLE. It adds no crate on either target, because
# it is already in both graphs — measured 2026-09-17 by diffing
# `cargo tree --edges normal --no-default-features --features qwen3tts` over
# `--target aarch64-apple-darwin` and `--target aarch64-unknown-linux-gnu`:
# 308 and 310 packages, byte-identical package sets before and after. On the
# Mac the burn-cubecl / burn-wgpu / cubek stack this feature already builds on
# pulls the facade in (`cargo tree -i cubecl` lists eight-plus dependents and
# no `cubecl-cuda`); on Linux `burn`'s `cuda` feature is unconditional in the
# target table below, so `cubecl-cuda` is in that graph either way. Same shape
# as `cubek` in [dependencies] — naming a crate the graph already carries,
# rather than adding one.
#
# It is deliberately NOT `cubecl?/cuda`: the cuda feature is target-scoped in
# `[target.'cfg(target_os = "linux")'.dependencies]`, so the Mac keeps `std`
# only and never links a CUDA toolkit. Without this, `--features qwen3tts` on
# Linux did not compile at all (the `speak` module resolved
# `burn::backend::cuda::CudaDevice` — burn/cuda being on — but not `cubecl`
# itself), which is what `mary-model-migration` hit: it takes mary with
# exactly this feature and nothing else.
qwen3tts = ["dep:tokenizers", "dep:burn-fusion", "dep:burn-cubecl", "dep:cubecl", "dep:libm", "dep:memmap2", "dep:sha2"]
# Research prototype: hand-fused cubecl kernels for the talker's single-token
# decode step (qwen3tts::megakernel) — one dispatch per fused stage instead of
# ~18 burn ops per layer. The lever is host submission count, not FLOPs.
megakernel = ["qwen3tts", "dep:cubecl", "cubecl?/wgpu"]
# The code predictor on the GPU (qwen3tts::predictor_gpu) — hand-fused cubecl
# kernels for the sub-talker's 16-position frame. Rides `q4`'s cubecl dep and
# its `Rt` alias, so the same kernels build for wgpu/Metal and for CUDA.
predictor-gpu = ["qwen3tts", "q4"]
# PersonaPlex-7B LM port (mary::models::personaplex::temporal) parity lane:
# the CPU-f32 probe runs the 7B under burn-ndarray (Accelerate BLAS) for a
# single deterministic numeric path — parity before performance. The model
# code itself is backend-generic and rides `qwen3tts` (it reuses those layers).
personaplex = ["qwen3tts", "dep:burn-ndarray", "burn-ndarray/blas-accelerate"]
# PersonaPlex realtime lane: q4 (4-bit grouped) weight quantization with a
# dequant-in-kernel matvec (mary::nn::q4) — the bandwidth lever that turns the
# Moshi temporal transformer's 17.2 GB/step f16 stream into ~4.8 GB. Additive:
# a cubecl kernel + host wrapper + the moshi_q4_probe spike; no model changes.
# memmap2 backs zero-copy aliased weight loads on supported paths.
q4 = ["dep:cubecl", "cubecl?/wgpu", "dep:memmap2"]
# MXFP4 (microscaling FP4) decode + the bit-exact MXFP4 -> NVFP4 transcode
# gate (`mxfp4_gate`). The codec itself (mary::nn::mxfp4) is dependency-free
# and always compiled; only the gate needs sha2, to hash the full decode of
# real checkpoint bytes against the k3oracle reference hashes.
mxfp4 = ["dep:sha2"]
# `mary::speak` — the production voice seam: Qwen3-TTS synthesis loading its
# weights from a durable standalone pile (no safetensors in the load path).
speak = ["qwen3tts", "predictor-gpu", "megakernel"]
# Voxtral-Mini-4B-Realtime (mary::models::voxtral) — delay-
# conditioned streaming STT. Tekken tokenizer is decode-only (serde_json,
# already unconditional); fusion deps for the BFused decode loop; memmap2
# for the rawhalf lane's zero-copy leaf aliasing (MmapRaw owner downcast).
voxtral = ["dep:burn-fusion", "dep:burn-cubecl", "dep:memmap2"]
# Construct a `tokenizers::Tokenizer` DIRECTLY from a tokenizer graph
# (mary::tokenizer::build_tokenizer + persist::load_tokenizer_from_pile) —
# the load half of tokenizers-as-tribles: no tokenizer.json anywhere in the
# runtime path, the `tokenizers` crate is just the executor (as Burn is for
# weights).
tokenizer = ["dep:tokenizers"]
# Kimi-K3's tiktoken byte-level BPE (mary::tiktoken + tokenizer::save_tiktoken)
# — a pure-Rust port of the shipped `tokenization_kimi.py`, gated id-for-id
# against it by the `k3_tokenizer_gate` binary. Only dep is fancy-regex.
k3tok = ["dep:fancy-regex"]
# CLIP ViT-B/32 multi-modal embedder (mary::embed) — image+text into one
# contrastive space behind LocalEmbedder. Needs image decode + tokenizers;
# light enough to stay out of the default build. Embedders load from a
# content-addressed pile.
embed = ["dep:image", "dep:tokenizers", "tokenizer"]
gemma = [
    # NOTE: `hub` is deliberately NOT here. It was, so that the three gemma
    # binaries below could reach hf-hub without declaring it — but that made a
    # model RUNTIME feature carry a model DOWNLOADER, and hf-hub 0.3 hard-wires
    # native-tls, so every LIBRARY consumer inherited a system OpenSSL
    # requirement. faculties takes `mary/gemma` from its DEFAULT `local-embed`
    # feature, so a default faculties build could not compile anywhere OpenSSL
    # dev headers were absent — including the Sparks, which is exactly where
    # builds are supposed to happen. Nothing in the LIBRARY uses hf_hub (the
    # one hit in src/embed.rs is a doc comment). The binaries that need it now
    # say so in their own required-features, 2026-09-01.
    "burn/ndarray",
    "dep:burn-ndarray",
    "dep:cubecl",
    "cubecl?/wgpu",
    "dep:wgpu",
    "dep:pollster",
    "dep:memmap2",
    "dep:bytes",
    "dep:rustfft",
    "dep:rubato",
    "dep:symphonia",
    "dep:image",
    "dep:tokenizers",
    "half/num-traits",
]
# gemma_gen in half precision (f16 weights) — lets the dense 31B fit 128GB.
f16gen = []
# Live mic capture (cpal) — the model-agnostic half of a listen loop. Both
# ear lanes compose it with their model feature: `gemma,listen` builds
# gemma_listen; `voxtral,listen` unlocks voxtral_listen's --mic mode.
listen = ["dep:cpal"]
# The in-process text-generation seam for the playground (mary::local). Pulls in
# the gemma engine. The playground depends on mary behind this feature;
# the default build stays light.
local-model = ["gemma"]
# Hand-run probes / parity gates that build under the default (f5-only) deps.
# Gating them keeps the DEFAULT build a pure library: `cargo build --release`
# produces no separately-built binaries, so nothing in any production path can
# drift stale against the pile blob format (stale-standalone-binary drift is
# fixed at the class level — consumers call `mary::say` in-process). Run a
# probe with `--features dev-tools`.
# The probes compare against safetensors oracles, so this pulls `import`.
dev-tools = ["import"]

# Kimi K3 (mary::models::kimi_k3). Dep-free at the model layer — the router
# is pure Rust over slices, no burn backend and no safetensors: the gate
# projection is an 896x7168 f32 matmul whose *reduction order* is load-bearing
# (the margin between the 16th and 17th score gets down to 3.1e-06 on real
# tokens, so a sloppier reduction reroutes tokens), which is a poor fit for a
# backend's default gemm. `sha2` is for the gate binary, which asserts the
# exported weight artifact against a digest taken from the safetensors shards.
# The `mary` CLI — the import front door. Behind `import` (safetensors + clap),
# out of the default library build.
[[bin]]
name = "mary"
required-features = ["import", "hub"]

[[bin]]
name = "qwen3_5_deltanet_gate"
required-features = ["qwen3_5-cuda"]

# Totality gate for the K3 checkpoint layout: walks the real safetensors headers
# and asserts the tensor-name/module-slot mapping is a bijection. Header-only -
# it reads no tensor data - but it needs a safetensors reader, hence `import`.
[[bin]]
name = "k3_layout_gate"
required-features = ["k3"]

# Totality gate for the Inkling checkpoint layout: asserts the name->slot map is
# a bijection onto a real checkpoint. Reads safetensors headers only.
[[bin]]
name = "inkling_layout_gate"
required-features = ["inkling-cuda"]

# Parity gate for the NVFP4 expert decode against compressed_tensors, which is
# the library that defines this packing. Reads a small raw-binary oracle bundle.
[[bin]]
name = "inkling_nvfp4_gate"
required-features = ["inkling-cuda"]

# Parity gate for the block primitives (RMSNorm, short convolution, router)
# against the transformers reference implementation.
[[bin]]
name = "inkling_block_gate"
required-features = ["inkling-cuda"]

# Parity gate for Inkling attention against the transformers reference, run on
# BOTH a sliding-window and a global layer -- they are different functions.
[[bin]]
name = "inkling_attn_gate"
required-features = ["inkling-cuda"]

# bf16_linear at the shapes a decode step issues, timed with a sync -- the
# access-pattern question, without a 50 s pile open in front of it.
[[bin]]
name = "inkling_bf16_gemm_bench"
required-features = ["inkling-cuda"]

# Whether TIMING the lane order picks a different lane than WALKING it, at the
# verify widths. Prints both picks per shape; it answers a question, and the
# end-to-end harness answers whether the answer is worth anything.
[[bin]]
name = "inkling_gemm_autotune_gate"
required-features = ["inkling-cuda"]

# The attention layer with its five projections as the BF16 the pile stores,
# against the transformers f32 reference at the real widths -- a DELTA inside a
# stated budget, which is the check a non-bit-exact numerics change needs.
[[bin]]
name = "inkling_attn_bf16_gate"
required-features = ["inkling-cuda"]

# Parity gate for the MLPs (dense and MoE) and the whole decoder layer.
[[bin]]
name = "inkling_layer_gate"
required-features = ["inkling-cuda"]

# End-to-end gate: one REAL layer of the released checkpoint, loaded through the
# layout and the NVFP4 decode, against transformers running the same layer.
[[bin]]
name = "inkling_real_gate"
required-features = ["inkling-cuda"]

# The text stack's two ends -- embedding + embed_norm in, final norm + muP +
# head + vocab truncation out -- and two real layers composed.
[[bin]]
name = "inkling_stack_gate"
required-features = ["inkling-cuda"]

# The vision (HMLP) and audio (dMel) towers, including the derived scale plan.
[[bin]]
name = "inkling_towers_gate"
required-features = ["inkling-cuda"]

# The MTP blocks. transformers ships the MTP config surface and no
# implementation, so the blocks are gated and the composition is reported as
# having no oracle rather than silently guessed.
[[bin]]
name = "inkling_mtp_gate"
required-features = ["inkling-cuda"]

# A real forward of the released checkpoint on one machine, paging expert slabs
# per layer. The one check that can validate the name mapping independently:
# coherent continuations cannot come out of a wrong mapping.
[[bin]]
name = "inkling_forward"
required-features = ["inkling-cuda"]

# Drive a `Session` and print the tokens it produces. The PARITY HARNESS for the
# seam: `inkling_forward` reaches a token through a loop inside `main`, a
# `Session` reaches it by holding the model open, and the only claim worth making
# about the second is that it agrees with the first. Also the demonstration that
# a session survives turns -- `--turns` feeds each turn's output back as the next
# turn's delta against a KV cache that is never rebuilt.
[[bin]]
name = "inkling_session"
required-features = ["inkling-cuda"]

[[bin]]
name = "inkling_sequence_gate"
required-features = ["inkling-cuda"]

[[bin]]
name = "inkling_learn"
required-features = ["inkling-cuda", "tokenizer"]

# Text on stdin, an ids file out — the missing half of a forward that reads ids
# and never text. Same `tokenizers` executor as the gate below, which is what
# makes it one tokenizer rather than a second transcription.
[[bin]]
name = "inkling_encode"
required-features = ["tokenizer"]

# Does Inkling's BPE tokenizer survive the trip through the trible graph? Both
# sides of the comparison need the `tokenizers` executor, so this is the one
# inkling binary gated on `tokenizer` rather than `inkling`.
[[bin]]
name = "inkling_tokenizer_gate"
required-features = ["tokenizer"]

# A checkpoint's JSON sidecars as facts, and the round-trip gate over them.
# Needs `import` for nothing device-side and `tokenizer` for the pile-writing
# half (`persist::ingest_json_documents` sits behind the same flag as the
# tokenizer ingest it is a sibling of).
[[bin]]
name = "inkling_meta_gate"
required-features = ["tokenizer", "inkling-cuda"]

# How much DEVICE memory this part hands out, and what a resident set of that
# size costs to read. Both are properties of the box, and nvidia-smi answers
# [N/A] for both on a unified part, so they have to be measured by allocating.
[[bin]]
name = "inkling_device_ceiling"
required-features = ["inkling-cuda"]

# Compile-only dump of the hand 4-bit GEMM lanes at the head's own k, so the
# generated CUDA can be disassembled offline. Touches the GPU for microseconds.
[[bin]]
name = "fp4_lane_dump"
required-features = ["inkling-cuda"]

# The m16n8k16 B fragment map off the device, plus the sector/line counting that
# says whether the k16 access costs DRAM bytes or only requests. No model load.
[[bin]]
name = "mma16_lane_dump"
required-features = ["inkling-cuda"]

# Does the m16n8k16 B permutation buy anything, and on which plane? Interleaved
# arms against a coalesced ceiling, in one process. No model load.
[[bin]]
name = "w4a16_swz_probe"
required-features = ["inkling-cuda"]

# The same two W4A16 lanes swept across GRID SIZE, on rotating buffers and
# pipelined launches -- the two things `w4a16_swz_probe` does not do, and
# without which a sink-shaped table sits in L2 and the arm order decides the
# answer.
[[bin]]
name = "w4a16_swz_grid"
required-features = ["inkling-cuda"]

# The missing rung between the coalesced 242 GB/s control and the shipped W4A16
# head lane: the SAME load stream and the SAME one-warp-per-tile geometry with
# the dequantise and the MMA removed, so "66% of the ceiling" can be split into
# what the access pattern costs and what the arithmetic costs.
[[bin]]
name = "w4a16_geom_ceiling"
required-features = ["inkling-cuda"]

# Read bandwidth for device-allocated vs host-mapped memory, on a working set
# far larger than L2. Any figure above this part's ~273 GB/s bus is a cache
# measurement, which is how a 992 GB/s number got into circulation.
[[bin]]
name = "inkling_membw"
required-features = ["inkling-cuda", "cuda-backend"]

# The routed-expert GEMM with its B operand staged through shared memory,
# against the same GEMM reading B straight out of global. Both arms in one
# process on one table, because a cross-worktree comparison on this box is a
# comparison of two autotune caches.
[[bin]]
name = "fp4_smem_probe"
required-features = ["inkling-cuda", "cuda-backend"]

# KDA parity gate: mary::models::kimi_k3::kda against the flash-linear-attention
# oracle vectors (Triton kernels + fla's own float64 references). Reads .npz
# only — no checkpoint, no safetensors — so it does not ride `dev-tools`.
[[bin]]
name = "kimi_kda_gate"
required-features = ["k3"]

# MLA parity gate: mary::models::k3::mla against the whole-layer oracle captured
# from the shipped KimiMLAAttention on real checkpoint weights. Reads the
# checkpoint shards directly (mmap + safetensors) and two oracle .npz bundles.
[[bin]]
